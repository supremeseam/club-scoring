# Hot-reload dev stack. Docker is the only prerequisite:
#   docker compose -f compose.dev.yml up
# then open http://localhost:5173  (logins: editor/editor, admin/admin)
services:
  api:
    image: python:3.13-slim
    working_dir: /repo/backend
    environment:
      DEBUG: "1"
      REQUIRE_2FA: "0"
      ALLOWED_HOSTS: "*"
      DATA_DIR: /repo/data
      UV_PROJECT_ENVIRONMENT: /opt/venv
      UV_LINK_MODE: copy
    volumes:
      - ./:/repo
      - pyenv:/opt/venv
    command: >
      sh -c "pip install -q uv &&
             uv sync &&
             uv run python manage.py migrate &&
             uv run python manage.py seed_demo &&
             uv run python manage.py runserver 0.0.0.0:8000"
    ports: ["8000:8000"]

  web:
    image: node:22-alpine
    working_dir: /repo/frontend
    environment:
      BACKEND_URL: http://api:8000
    volumes:
      - ./:/repo
      - node_modules:/repo/frontend/node_modules
    command: sh -c "npm install && npm run dev"
    ports: ["5173:5173"]
    depends_on: [api]

volumes:
  pyenv:
  node_modules:
