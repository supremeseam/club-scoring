[project]
name = "club-scoring"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "django>=5.1,<5.3",
  "django-ninja>=1.3",
  "django-otp>=1.5",
  "django-axes>=7.0",
  "django-simple-history>=3.7",
  "gunicorn>=22",
  "reportlab>=4.2",
  "pypdf>=5",
  "openpyxl>=3.1",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-django>=4.9"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
pythonpath = ["."]
testpaths = ["tests"]
