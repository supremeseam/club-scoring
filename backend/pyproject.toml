[project]
name = "club-scoring"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "django>=5.2.19,<5.3",
  "django-ninja>=1.8.0",
  "django-otp>=1.7.5",
  "django-axes>=7.0",
  "django-simple-history>=3.7",
  "gunicorn>=22",
  "reportlab>=5.1.0",
  "pypdf>=6.21.4",
  "openpyxl>=3.1",
  "pyjwt[crypto]>=2.8",
]

[dependency-groups]
dev = ["pytest>=9.2.0", "pytest-django>=4.9"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
pythonpath = ["."]
testpaths = ["tests"]
